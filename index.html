<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d111b">
  <meta name="description" content="Galería de fotos">
  <title>Galería de fotos</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Ir al inicio"><span class="brand-mark">◈</span> Galería de fotos<span class="brand-dot">.</span></a>
    <span class="top-note" id="counter" aria-live="polite">Cargando fotos…</span>
  </header>
  <main id="inicio">
    <section class="gallery-section" aria-label="Galería de fotos">
      <h1>Galería de fotos</h1>
      <div class="gallery" id="gallery"></div>
      <div class="empty" id="empty" hidden><h2>No hay fotos disponibles</h2><p>Comprueba el archivo <code>fotos.json</code> y la carpeta <code>fotos/</code>.</p></div>
      <div id="sentinel" aria-hidden="true"></div>
    </section>
  </main>
  <aside id="hover-preview" class="hover-preview" hidden aria-hidden="true"><img id="hover-image" alt=""></aside>
  <dialog id="lightbox" aria-label="Foto ampliada">
    <div class="viewer">
      <button id="close" class="viewer-button close" aria-label="Cerrar foto">✕</button>
      <button id="prev" class="viewer-button prev" aria-label="Foto anterior">‹</button>
      <img id="large-image" alt="Foto ampliada">
      <button id="next" class="viewer-button next" aria-label="Foto siguiente">›</button>
      <div class="viewer-caption"><span id="photo-name"></span><div class="viewer-actions"><span id="position"></span><a class="download-action" id="download-large" href="#" download>↓ Descargar foto</a></div></div>
    </div>
  </dialog>
  <script src="app.js?v=3" defer></script>
</body>
</html>
